services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: atally-app
    restart: always
    # Caddy がHTTPSを終端してこのコンテナへプロキシするため、ホストには公開せず内部公開のみ
    expose:
      - "80"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - atally

  caddy:
    image: caddy:2-alpine
    container_name: atally-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?DOMAIN must be set in .env (例: atally.jp)}"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app
    networks:
      - atally

  db:
    image: postgres:16-alpine
    container_name: atally-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-atally}
      POSTGRES_USER: ${DB_USERNAME:-atally}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-atally}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - atally

  redis:
    image: redis:7-alpine
    container_name: atally-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - atally

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:

networks:
  atally:
    driver: bridge
