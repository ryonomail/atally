[supervisord]
nodaemon=true
logfile=/proc/1/fd/1
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=5
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --memory=64
autostart=true
autorestart=true
priority=20
numprocs=1
process_name=%(program_name)s_%(process_num)02d
stopasgroup=true
killasgroup=true
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

[program:scheduler]
; 毎分0秒の境界に揃えてスリープし、ループのドリフト（日次タスクの取りこぼし）を防ぐ。
; %% は supervisord 用エスケープ（シェルには %S が渡る）。先頭ゼロ除去で8進数解釈エラーを回避。
command=/bin/sh -c "while true; do php /var/www/html/artisan schedule:run; S=$(date +%%S); S=${S#0}; sleep $((60 - ${S:-0})); done"
autostart=true
autorestart=true
priority=25
stopasgroup=true
killasgroup=true
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0
