user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $upstream_cache_status ${request_time}s';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    # gzip 圧縮（APIレスポンスのJSONサイズを60〜70%削減）
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # ── Nginx FastCGI マイクロキャッシュ ─────────────────────────────────────
    # PHP を完全バイパスして ~1-5ms でレスポンスを返す
    # /tmp は tmpfs（メモリ上）なので高速; max_size=50MB で270k件も余裕
    fastcgi_cache_path /tmp/nginx_fcgi_cache
        levels=1:2
        keys_zone=php_cache:10m
        max_size=50m
        inactive=2m
        use_temp_path=off;

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Authorization ヘッダーがあればキャッシュしない（ログイン済みユーザー）
        # POST/PUT/DELETE は fastcgi_cache_methods で自動除外（GET/HEADのみキャッシュ）
        set $skip_cache $http_authorization;

        # ビルド済みアセット（長期キャッシュ）
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 静的ファイル
        location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|css|js)$ {
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # PHP アプリケーション
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 60;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;

            # ── FastCGI キャッシュ設定 ──────────────────────────────────────
            fastcgi_cache php_cache;
            fastcgi_cache_key "$request_method:$host$request_uri";
            fastcgi_cache_valid 200 30s;       # 30秒キャッシュ
            fastcgi_cache_bypass $skip_cache;   # ログイン済みはバイパス
            fastcgi_no_cache $skip_cache;
            # キャッシュ更新中も古いレスポンスを返す（ユーザーを待たせない）
            fastcgi_cache_use_stale error timeout updating invalid_header;
            fastcgi_cache_background_update on;
            fastcgi_cache_lock on;             # 同時リクエストが重複してPHPを叩かない
            fastcgi_cache_methods GET HEAD;    # GET/HEADのみキャッシュ

            add_header X-Cache $upstream_cache_status;
        }

        # 隠しファイルへのアクセス禁止
        location ~ /\. {
            deny all;
        }

        # .env などの機密ファイルへのアクセス禁止
        location ~ /\.(env|git|htaccess) {
            deny all;
        }
    }
}
