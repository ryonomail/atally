[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; 動的プロセス管理（Render Starter: 512MB RAM想定）
; OPcache 64MB + nginx ~20MB + OS ~80MB = 残り ~350MB → worker 1台 ~40MB × 7 = 280MB
pm = dynamic
pm.max_children = 7
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; タイムアウト設定
request_terminate_timeout = 120s
