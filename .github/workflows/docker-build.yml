name: Build and Push Docker Image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      base-changed: ${{ steps.changes.outputs.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if Dockerfile.base changed
        id: changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q 'Dockerfile.base'; then
            echo "base=true" >> $GITHUB_OUTPUT
          else
            echo "base=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        if: steps.changes.outputs.base == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.changes.outputs.base == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push base image
        if: steps.changes.outputs.base == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          tags: ghcr.io/${{ env.REPO }}-base:latest
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

  build-app:
    runs-on: ubuntu-latest
    needs: build-base
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ghcr.io/${{ env.REPO }}:latest
          build-args: |
            BASE_IMAGE=ghcr.io/${{ env.REPO }}-base:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
