<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>配信停止</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="login-body">
  <div class="card login-card">
    <h1>配信停止</h1>
    {% if state == 'confirm' %}
      <p>{{ email }} へのご案内メールを停止します。</p>
      <form method="post">
        <input type="hidden" name="e" value="{{ email }}"><input type="hidden" name="t" value="{{ token }}">
        <button class="btn btn-primary" type="submit">配信を停止する</button>
      </form>
    {% elif state == 'done' %}
      <p>{{ email }} への配信を停止しました。今後ご案内をお送りすることはありません。<br>ご迷惑をおかけし申し訳ございませんでした。</p>
    {% else %}
      <p>リンクが正しくありません。お手数ですがメール本文のリンクをもう一度お試しください。</p>
    {% endif %}
  </div>
</body>
</html>
